name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: node tests/run_tests.js
      - name: dist/ is up to date with src/
        run: |
          python build.py
          git diff --exit-code dist/ || (echo "::error::dist/fontanclinic.html is stale — run 'python build.py' and commit" && exit 1)
