<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FontanClinic — raadpleging</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫀</text></svg>">
<style>
:root{
  --paper:#F2F4F6; --panel:#FFFFFF; --ink:#1B2733; --muted:#5D6A77; --rule:#D6DDE3; --soft:#E9EDF1;
  --accent:#1F5C8C; --accent-ink:#FFFFFF; --focus:#3B82C4;
  --abn:#B23A3A; --warn:#B7791F; --ok:#2F7A4F; --na:#A3ACB5;
  --abn-bg:#FBEFEF; --warn-bg:#FCF4E6; --ok-bg:#EEF6F1;
  --radius:6px;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; color:var(--ink); background:var(--paper); color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121820; --panel:#1A222C; --ink:#E4E9EE; --muted:#98A5B2; --rule:#2D3945; --soft:#222C37;
  --accent:#6FA8D6; --accent-ink:#0E1620; --abn:#E07A7A; --warn:#E0A85A; --ok:#6CC091; --na:#5F6B77;
  --abn-bg:#3A2224; --warn-bg:#3A2F1E; --ok-bg:#1D3326;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 20px 0}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-weight:650;font-size:16px;letter-spacing:-.01em;margin-right:6px}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.id{display:flex;align-items:center;gap:6px}
.id label{color:var(--muted);font-size:12.5px}
.id input{border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);padding:5px 8px;width:130px;font-variant-numeric:tabular-nums}
.id input[type=date]{width:150px}
.search{flex:1;min-width:200px;max-width:360px;position:relative}
.search input{width:100%;border:1px solid var(--rule);border-radius:999px;padding:6px 12px 6px 30px;background:var(--soft)}
.search::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;border:1.6px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:20px;top:58%;width:5px;height:1.6px;background:var(--muted);transform:rotate(45deg)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);font-family:inherit}
.actions{display:flex;gap:8px;margin-left:auto}

/* circuit tabs */
nav#tabs{display:flex;gap:0;margin-top:10px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 13px 10px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab.circ{padding-left:22px}
.tab.circ::before{content:"";position:absolute;left:8px;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-58%);background:var(--na)}
.tab.circ.s-abn::before{background:var(--abn)} .tab.circ.s-warn::before{background:var(--warn)} .tab.circ.s-ok::before{background:var(--ok)}
.tab.circ + .tab.circ{margin-left:14px}
.tab.circ + .tab.circ::after{content:"";position:absolute;left:-13px;top:50%;width:12px;height:0;border-top:1.5px solid var(--rule);transform:translateY(-1px)}
.tab.circ + .tab.circ > *{}

/* layout */
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
details#pastePanel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:12px}
details#pastePanel > summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:12px;align-items:baseline}
details#pastePanel > summary::-webkit-details-marker{display:none}
details#pastePanel > summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details#pastePanel[open] > summary::before{transform:rotate(90deg)}
#parseSummary{font-weight:400;color:var(--muted)}
.pastebody{padding:0 14px 14px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.srccard{display:flex;flex-direction:column;gap:5px;border:1px solid var(--rule);border-radius:var(--radius);padding:8px 10px 10px;background:var(--panel)}
.srccard.done{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.srchead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.srchead label{font-weight:600;font-size:13px}
.srcstat{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.srccard textarea{width:100%;min-height:96px;border:1px solid var(--rule);border-radius:var(--radius);padding:7px 8px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;background:var(--soft);resize:vertical}
.chipsum{display:inline-block;font-size:12px;font-weight:500;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:1px 9px;margin-right:6px}
.pdot.prev{background:var(--accent)}
.muted{color:var(--muted);font-weight:400}
.dbox.srcbox{grid-column:1/-1}
ul#notes{margin:0 0 12px;padding:0;list-style:none}
ul#notes li{background:var(--warn-bg);border-left:3px solid var(--warn);padding:6px 10px;margin-bottom:4px;border-radius:0 var(--radius) var(--radius) 0;font-size:13px}
#view{outline:none}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:var(--radius);padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.file{display:inline-block}

/* fields */
.group{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px 14px;margin-bottom:12px}
.group h3{margin:0 0 10px;font-size:13px;font-weight:650;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.fdom{margin-left:auto;font-size:11px;color:var(--accent)}
.field input,.field select,.field textarea{border:1px solid var(--rule);border-radius:var(--radius);padding:5px 8px;background:var(--panel);min-width:0;width:100%}
.field textarea{resize:vertical;min-height:52px}
.field.cpet input{background:var(--soft)}
.numwrap{display:flex;align-items:stretch}
.numwrap input{font-variant-numeric:tabular-nums;text-align:right;border-top-right-radius:0;border-bottom-right-radius:0}
.numwrap .unit{border:1px solid var(--rule);border-left:0;border-radius:0 var(--radius) var(--radius) 0;padding:5px 7px;font-size:11.5px;color:var(--muted);background:var(--soft);white-space:nowrap;display:flex;align-items:center}
.numwrap input:only-child{border-radius:var(--radius)}
input.invalid{border-color:var(--abn)!important;background:var(--abn-bg)!important}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok);vertical-align:middle}
.pdot.ambiguous{background:var(--warn);box-shadow:0 0 0 2px var(--warn-bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details.sub{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:10px}
details.sub > summary{padding:10px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
details.sub > .group{border:0;border-top:1px solid var(--soft);border-radius:0;margin:0}

/* overview */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.metric{background:var(--panel);padding:10px 14px}
.mv{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ml{font-size:12px;color:var(--muted)} .ml span{color:var(--accent)}
.domains{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dbox{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--na);border-radius:var(--radius);padding:10px 14px}
.dbox.s-abn{border-left-color:var(--abn)} .dbox.s-warn{border-left-color:var(--warn)} .dbox.s-ok{border-left-color:var(--ok)}
.dbox h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:7px}
.dbox ul{list-style:none;margin:0;padding:0}
.dbox li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--soft);font-size:13px;line-height:1.4}
.dbox li:first-child{border-top:0}
.dbox li b{font-weight:600}
.dbox li small{display:block;color:var(--muted);font-size:12px}
.dbox li.s-warn{background:var(--warn-bg);margin:0 -8px;padding:5px 8px;border-radius:4px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:4px;background:var(--na)}
h3 .sdot,summary .sdot{margin-top:0}
.sdot.s-info{background:var(--na)} .sdot.s-abn{background:var(--abn)} .sdot.s-warn{background:var(--warn)} .sdot.s-ok{background:var(--ok)}
details.lab{margin-top:12px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:8px 14px}
details.lab summary{cursor:pointer;color:var(--muted)}
details.lab pre{white-space:pre-wrap;font-size:12.5px;font-family:inherit}
.empty{border:1px dashed var(--rule);border-radius:var(--radius);padding:18px;color:var(--muted);margin-bottom:14px;background:var(--panel)}

/* letter */
.letterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
#letterText{width:100%;min-height:62vh;border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px;background:var(--panel);font-family:Arial,sans-serif;font-size:13.5px;line-height:1.55;resize:vertical;max-width:900px;display:block}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.hint.warn{color:var(--warn)}
ul.plain{margin:0;padding-left:18px;line-height:1.7}
code{font-size:12px;background:var(--soft);padding:1px 4px;border-radius:3px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;font-size:13px;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)} .toast.bad{background:var(--abn);color:#fff}
@media (max-width:720px){header.top{position:static;padding:8px 12px 0} main{padding:12px} .actions{margin-left:0} .id input{width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header.top,#pastePanel,#notes,.letterbar,.hint{display:none} #letterText{border:0;min-height:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <div class="brand">FontanClinic<small>raadpleging</small></div>
    <div class="id"><label for="hdrEad">EAD</label><input id="hdrEad" autocomplete="off" inputmode="numeric"></div>
    <div class="id"><label for="hdrDate">Datum</label><input id="hdrDate" type="date"></div>
    <div class="search"><input id="search" type="search" placeholder="Zoek veld: ferr, varices, pvp…" aria-label="Zoek veld" autocomplete="off"><kbd>Ctrl K</kbd></div>
    <div class="actions">
      <label class="btn file" title="Neemt anatomie, voorgeschiedenis en planning over uit de Excel-file van het vorige bezoek">Vorig bezoek laden<input type="file" id="prevFile" accept=".xlsx" hidden></label>
      <button class="btn ghost" id="btnReset">Nieuw bezoek</button>
    </div>
  </div>
  <nav id="tabs" role="tablist" aria-label="Domeinen"></nav>
</header>
<main>
  <details id="pastePanel" open>
    <summary>Bronverslagen <span id="parseSummary"></span></summary>
    <div class="pastebody">
      <div id="srcGrid" class="srcgrid"></div>
      <p class="hint">Plakken leest meteen in. Staan meerdere verslagen in één vak, dan worden ze herkend en elk apart ingelezen. <span class="pdot parsed"></span> ingelezen · <span class="pdot ambiguous"></span> voorstel, controleren · <span class="pdot prev"></span> vorig bezoek</p>
    </div>
  </details>
  <ul id="notes"></ul>
  <div id="view" tabindex="-1"></div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ======================================================================
   FontanClinic — core logic (no DOM). Config, fields, parser, derive, letter.
   ====================================================================== */

/* ---------------------------------------------------------------- CONFIG
   Items marked CONFIRM are provisional defaults awaiting confirmation. */
const CONFIG = {
  T: {
    rer_maximal: 1.05,          // RER > 1.05 = maximal test
    peak_vo2_pct_pred: 80,      // flowchart: peak VO2 < 80 % pred (for Fontan)
    ve_mvv: 0.80,
    mvv_factor: 40,
    tiffeneau_obstructive: 0.70,
    fev1_pct_low: 80,
    ve_vco2_classes: [30, 36, 45], // Arena I <30, II 30–35.9, III 36–44.9, IV ≥45
    pvp_at_x: 19.2,             // flowchart: PVP@33 > 19.2 mmHg
    pvp_co_slope: 3.0,          // flowchart: pressure–CO slope > 3
    dsvi_pct: -10,              // ΔSVi ≤ −10 %
    dspo2: 5,                   // fall in SpO2 rest -> peak (%-points)
    dco_dvo2: 7,
    cavo2_peak: 14,
    svo2_implausible: 20,
    cavo2_fraction_of_cao2: 0.90,
    ferritin_low: 100, ferritin_mid: 300, tsat_low: 20,
    egfr_categories: [90, 60, 30],
    acr_a2: 30, acr_a3: 300,
    platelets_low: 150,
  },
  // Predicted peak VO2: FRIEND (de Souza e Silva et al., Eur J Prev Cardiol 2018;25:742-750):
  // VO2max (ml/kg/min) = 45.2 - 0.35*age - 10.9*sex(M=1,F=2) - 0.15*weight(lb) + 0.68*height(in) - 0.46*mode(treadmill=1, bike=2)
  VO2_PRED_REFERENCE: "friend",
  EXERCISE_MODE: 2,                                        // cycle ergometer
  // PVP interpolated at a VO2 equal to 33 % of the FRIEND-predicted peak VO2 (absolute, ml/min)
  PVP_AT: { axis: "pct_pred_vo2", value: 33, confirmed: true },
  TWO_VALUE_STAGES: ["rest", "peak"],                      // rows with 2 values = rest + peak (confirmed)
  PVP_SLOPE_METHOD: "two_point",                           // two_point | regression
  FONLIVER_TABLE: null,                                    // manual score entry
  DECIMAL_COMMA: true,
};

function settingsSummary() {
  const c = CONFIG, T = c.T;
  return [
    "Voorspelde piek-VO2: FRIEND (de Souza e Silva 2018), fietsergometer; gewicht bij CPET, lengte",
    `PVP@${c.PVP_AT.value}: Fontandruk geïnterpoleerd bij VO2 = ${c.PVP_AT.value}% van de FRIEND-voorspelde piek-VO2 (drempel > ${T.pvp_at_x} mmHg)`,
    `PVP-CO slope: rust → piek (drempel > ${T.pvp_co_slope} mmHg/L/min)`,
    "Rijen met 2 waarden in de inspanningsecho → rust + piek",
    "Hartfrequentie: enkel rust en piek gerapporteerd (geen chronotrope beoordeling)",
    `Desaturatie: daling SpO2 ≥ ${T.dspo2} %-punt`,
    `ΔSVi preload-limitatie: ≤ ${T.dsvi_pct}%`,
    "FonLiver: manuele invoer",
  ];
}

/* ---------------------------------------------------------------- FIELDS */
const DOMAINS = [
  ["header", "Bezoek"], ["cv", "Cardiovasculair"], ["pulm", "Pulmonaal"], ["periph", "Perifeer"],
  ["liver", "Lever (FALD)"], ["kidney", "Nier"], ["lymph", "Lymfatisch"], ["collat", "Collateralen"],
  ["venous", "Veneus"], ["other", "Overige eindorganen"], ["psych", "Psychosociaal"], ["plan", "Beleid"],
];
const DOMAIN_LABEL = Object.fromEntries(DOMAINS);
const FLAG_DOMAIN_LABEL = Object.assign({}, DOMAIN_LABEL, { src: "Bronnen & dubbels" });
const ENDORGAN = ["liver", "kidney", "lymph", "collat", "venous", "other"];
const YN = ["", "nee", "ja"];
const GRADE = ["", "geen", "licht", "matig", "ernstig"];

const FIELDS = [];
function add(key, label, domain, kind = "num", o = {}) {
  FIELDS.push({ key, label, domain, kind, unit: o.unit || "", dec: o.dec ?? 1, options: o.options || null,
    cf: !!o.cf, source: o.source || "manual", group: o.group || "", help: o.help || "" });
}
function stages(prefix, label, domain, unit, dec, group, which = ["rest", "low", "peak"], source = "cpet") {
  const nm = { rest: "rust", low: "low", peak: "piek" };
  for (const s of which) add(`${prefix}_${s}`, `${label} ${nm[s]}`, domain, "num", { unit, dec, group, source });
}

// header
add("ead", "EAD nr", "header", "text");
add("visit_date", "Datum bezoek", "header", "date");
add("lab_date", "Datum bloedname", "header", "text");
add("age", "Leeftijd", "header", "num", { unit: "jaar", dec: 0 });
add("sex", "Geslacht", "header", "select", { options: ["", "M", "V"], cf: true });
add("diagnosis", "Diagnose", "header", "text", { cf: true, help: "bv. een hypoplastisch linkerhartsyndroom" });
add("fontan_details", "Fontan details", "header", "text", { cf: true, help: "bv. Norwood, Glenn, 18mm extracardiale TCPC" });
add("fenestration", "Fenestratie", "header", "select", { options: ["", "geen", "open", "gesloten", "onbekend"], cf: true });
add("history_extra", "Bijkomende voorgeschiedenis (zin na intro)", "header", "longtext", { cf: true });
add("meds_text", "Thuistherapie", "header", "longtext", { source: "cpet" });

// cardiovascular
let g = "Kliniek";
add("symptoms", "Klachten aanwezig", "cv", "multi", { group: g, options: ["dyspnoe", "duizeligheid", "hoofdpijn", "palpitaties", "syncope", "thoracale pijn", "oedeem", "vermoeidheid"] });
add("nyha", "NYHA klasse", "cv", "select", { options: ["", "I", "II", "III", "IV"], group: g });
add("congestion", "Systeemveneuze stuwing", "cv", "select", { options: YN, group: g });
add("spo2_clinic", "Saturatie rust (raadpleging)", "cv", "num", { unit: "%", dec: 0, group: g });
add("hr_clinic", "Pols (raadpleging)", "cv", "num", { unit: "/min", dec: 0, group: g });
add("sbp_clinic", "SBD (raadpleging)", "cv", "num", { unit: "mmHg", dec: 0, group: g });
add("dbp_clinic", "DBD (raadpleging)", "cv", "num", { unit: "mmHg", dec: 0, group: g });
add("smoking", "Roken", "cv", "select", { options: ["", "niet", "ex-roker", "actief"], group: g });
add("ecg_rhythm", "ECG ritme", "cv", "select", { group: g, options: ["", "sinusritme", "junctioneel ritme", "atriale flutter/IART", "voorkamerfibrillatie", "atriale pacing", "ventriculaire pacing"] });
add("ecg_rate", "ECG frequentie", "cv", "num", { unit: "/min", dec: 0, group: g });
add("ecg_change", "ECG t.o.v. vorige", "cv", "select", { options: ["", "essentieel onveranderd", "gewijzigd"], group: g });
add("ecg_comment", "ECG commentaar", "cv", "text", { group: g });
g = "Echo & biomarkers";
add("echo_connections", "Fontan connecties", "cv", "select", { options: ["", "mooi/patent", "stenose", "niet beoordeelbaar"], group: g });
add("vent_function", "Ventrikelfunctie", "cv", "select", { group: g, options: ["", "goede", "licht verminderde", "matig verminderde", "ernstig verminderde"] });
add("lvef", "EF systemische ventrikel", "cv", "num", { unit: "%", dec: 0, group: g });
add("avv_name", "Systemische AV-klep (naam)", "cv", "text", { cf: true, group: g, help: "bv. mitralisklep" });
add("avv_regurg", "AV-klep insufficiëntie", "cv", "select", { options: GRADE, group: g });
add("slv_name", "Semilunaire klep (naam)", "cv", "text", { cf: true, group: g, help: "bv. neo-aortaklep" });
add("slv_regurg", "Semilunaire klep insufficiëntie", "cv", "select", { options: GRADE, group: g });
add("echo_comment", "Echo commentaar", "cv", "longtext", { group: g, help: "kleine letter = achter de echozin, bv. stabiel t.o.v. vorige" });
add("ntprobnp", "NT-proBNP", "cv", "num", { unit: "pg/mL", dec: 0, group: g });
add("ntprobnp_interp", "NT-proBNP interpretatie", "cv", "select", { options: ["", "normaal", "verhoogd"], group: g });
add("swe_septal", "Septale SWE", "cv", "num", { unit: "m/s", dec: 2, group: g, help: "referentie 3 ± 0,6 m/s" });
g = "CPET — capaciteit";
add("rer_rest", "RER rust", "cv", "num", { dec: 2, group: g, source: "cpet" });
add("rer_low", "RER low", "cv", "num", { dec: 2, group: g, source: "cpet" });

const FIELD = Object.fromEntries(FIELDS.map(f => [f.key, f]));
if (Object.keys(FIELD).length !== FIELDS.length) throw new Error("duplicate field key");

function searchFields(q) {
  const toks = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  return FIELDS.filter(f => {
    const hay = [f.key, f.label, f.unit, DOMAIN_LABEL[f.domain], f.group, f.help].join(" ").toLowerCase();
    return toks.every(t => hay.includes(t));
  });
}

/* ---------------------------------------------------------------- text helpers (shared by all parsers) */
function sentencesOf(t) { return String(t || "").split(/(?<=[.!?])\s+(?=[A-ZÀ-Ü(])|\n+/).map(s => s.trim()).filter(Boolean); }
/* 'pos' if re occurs in a sentence without a preceding negation (geen/niet/zonder), 'neg' if only negated, null if absent */
function polarity(text, re) {
  let res = null;
  for (const s of sentencesOf(text)) {
    const m = s.match(re); if (!m) continue;
    const before = s.slice(0, m.index).toLowerCase().split(/\b(?:maar|wel|echter|doch)\b/).pop();
    if (/\b(geen|niet|zonder|nooit)\b/.test(before)) { if (res === null) res = "neg"; } else res = "pos";
  }
  return res;
}
/* regurgitation grade from free text: '2+/4', 'Lichte MI (1/4)', 'geen MI / stenose: ...' */
function gradeFrom(text) {
  const s = String(text || "").toLowerCase().split(/stenose/)[0];
  if (!s.trim()) return null;
  const m = s.match(/(\d)\s*\+?\s*(?:(?:a|à|-|tot)\s*\d\s*\+?\s*)?\/\s*4/);
  if (m) { const g = +m[1]; return g <= 1 ? "licht" : g === 2 ? "matig" : "ernstig"; }
  if (/\bgeen\b|\bafwezig/.test(s)) return "geen";
  if (/ernstig|belangrijk|severe/.test(s)) return "ernstig";
  if (/matig|moderate/.test(s)) return "matig";
  if (/licht|minim|trivi|discreet|mild|beperkt/.test(s)) return "licht";
  return null;
}

function _norm(label) {
  return label.replace(/\([^)]*\)/g, "").replace(/\*/g, " ").trim().toLowerCase()
    .replace(/\s+/g, " ").replace(/^[\s:]+|[\s:]+$/g, "");
}
function _nums(s) { return (s.match(/-?\d+(?:[.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", "."))); }
function _first(s) { const n = _nums(s); return n.length ? n[0] : null; }

function parseReport(text) {
  const values = {}, status = {}, notes = [];
  const put = (k, v, st = "parsed") => {
    if (v === null || v === undefined || v === "") return;
    if (values[k] !== undefined && values[k] !== null && values[k] !== "") return;
    values[k] = v; status[k] = st;
  };
  let section = null, refOrder = ["wasserman", "glaser"];
  const besluit = [], conclusion = [], meds = [];

  for (const raw of (text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const low = line.toLowerCase();
    if (/^[-_=|\s]+$/.test(line)) continue;
    if (low.startsWith("thuistherapie")) { section = "meds"; continue; }
    if (low.startsWith("biochemie") || low.startsWith("basismetingen") || low.startsWith("indicatie")) {
      section = null; if (!low.startsWith("indicatie")) continue;
    }
    if (low.startsWith("besluit")) { section = "besluit"; continue; }
    if (low.startsWith("cpet:")) { section = "cpet"; continue; }
    if (low.startsWith("inspanningsecho metingen")) { section = "echo"; continue; }
    if (low === "pulmonaal") { section = "pulm"; continue; }
    if (low.includes("wasserman") && low.includes("glaser")) {
      refOrder = low.indexOf("wasserman") < low.indexOf("glaser") ? ["wasserman", "glaser"] : ["glaser", "wasserman"];
      continue;
    }
    if (section === "meds") {
      if (line.startsWith("*")) { meds.push(line.replace(/^\*\s*/, "").trim()); continue; }
      section = null;
    }
    if (section === "besluit") {
      if (line.startsWith("*")) {
        const it = line.replace(/^\*\s*/, "").trim(); const i = it.indexOf(":");
        if (i >= 0 && it.slice(i + 1).trim()) besluit.push(it);
      } else conclusion.push(line);
      continue;
    }
    if (line.startsWith("|")) {
      const cells = line.replace(/^\|+|\|+$/g, "").split("|").map(c => c.trim());
      if (!cells.length) continue;
      const label = _norm(cells[0]), rest = cells.slice(1);
      if (section === "pulm" && cells.length >= 4) {
        for (const [lab, val] of [[cells[0], cells[1]], [cells[2], cells[3]]]) {
          const k = PULM_MAP[_norm(lab)]; if (k) put(k, _first(val));
        }
        continue;
      }
      const target = ROW_MAP[label];
      if (target === undefined) {
        if (_nums(rest.join(" ")).length && label !== "hfa-peff score") notes.push(`Onbekende tabelrij genegeerd: ‘${cells[0]}’`);
        continue;
      }
      if (Array.isArray(target)) { const v = _nums(rest.join(" ")); if (v.length) put(target[1], v[v.length - 1]); continue; }
      if (rest.length >= 2) {
        rest.slice(0, 3).forEach((c, i) => { const s = STAGES[i]; if ((STAGE_SUBSET[target] || STAGES).includes(s)) put(`${target}_${s}`, _first(c)); });
      } else {
        const v = rest.length ? _nums(rest[0]) : [];
        if (v.length >= 3) STAGES.forEach((s, i) => put(`${target}_${s}`, v[i]));
        else if (v.length === 2) {
          CONFIG.TWO_VALUE_STAGES.forEach((s, i) => put(`${target}_${s}`, v[i]));
        } else if (v.length === 1) {
          put(`${target}_rest`, v[0], "ambiguous");
          notes.push(`‘${cells[0]}’: 1 waarde, toegekend aan rust — controleren`);
        }
      }
      continue;
    }
    const ci = line.indexOf(":");
    if (ci >= 0) {

    if (line.trim()) blocks[kind].push(line.trim());
  }
  const cardiac = blocks.cardiac.join("\n"), nonc = blocks.noncardiac.join("\n"), iv = blocks.interventions.join("\n");

  const prim = PRIMARY_DX.find(([re]) => re.test(cardiac || dx));
  if (prim) {
    let dxs = prim[1];
    if (/congenitaal gecorrigeerde|\bccTGA\b|L-?TGA/i.test(cardiac)) dxs += " met congenitaal gecorrigeerde transpositie van de grote arteries";
    else if (/transpositie|\bTGA\b/i.test(cardiac)) dxs += " met transpositie van de grote arteries";
    put("diagnosis", dxs, "ambiguous");
  }
  // Fontan details
  const stagesF = [];
  if (/Damus|\bDKS\b/i.test(iv)) stagesF.push("DKS");
  if (/Norwood/i.test(iv)) stagesF.push("Norwood");
  if (/hemi-?Fontan/i.test(iv)) stagesF.push("hemi-Fontan"); else if (/Glenn|\bBCPC\b|\bBDG\b/i.test(iv)) stagesF.push("Glenn");
  const fl = iv.split("\n").find(l => /TCPC|\bFontan\b/i.test(l) && !/hemi-?Fontan/i.test(l));
  if (fl) {
    const mm = fl.match(/(\d+)\s*mm/);
    const type = /extracardia/i.test(fl) ? "extracardiale TCPC" : /lateral|intra-?atria|tunnel/i.test(fl) ? "laterale tunnel TCPC" : /atriopulm/i.test(fl) ? "atriopulmonale Fontan" : "TCPC";
    stagesF.push((mm ? mm[1] + "mm " : "") + type);
  }
  if (stagesF.length) put("fontan_details", stagesF.join(", "), "ambiguous");
  if (/fenestr/i.test(iv)) put("fenestration", /(sluit|sluiting|gesloten|afgesloten|occlu|amplatz)[^\n]*fenestr|fenestr[^\n]*(gesloten|dicht|occlu)/i.test(iv) ? "gesloten" : "open", "ambiguous");

  // non-cardiac history: classify fragments
  const diaphragm = [], venous = [], thrombo = [], arr = [], collat = [];
  for (let frag of nonc.split(/;|\n/)) {
    frag = frag.trim().replace(/^PO\s+/, "postoperatieve "); if (!frag) continue;
    if (/diafragma/i.test(frag)) { diaphragm.push(frag); continue; }
    for (const piece of frag.split(/,\s*/)) {
      if (/\bvena\b|\bvenae\b|\bVCI\b|\bVCS\b|femora|iliaca|trombo(?:se|flebitis)|\bDVT\b/i.test(piece)) venous.push(piece.trim());
      else if (/embol|\bCVA\b|infarct|\bTIA\b/i.test(piece)) thrombo.push(piece.trim());
    }
  }
  for (const frag of (nonc + "\n" + iv + "\n" + cardiac).split(/;|\n/))
    if (/flutter|fibrillatie|\bIART\b|tachycard|pacemaker|ablatie|\bICD\b|sinusknoop|AV-?blok/i.test(frag) && polarity(frag, /flutter|fibrillatie|IART|tachycard|pacemaker|ablatie|ICD|sinusknoop|AV-?blok/i) === "pos") arr.push(frag.trim());
  for (const frag of iv.split(/\n/)) if (/collateral/i.test(frag)) collat.push(frag.trim());
  if (diaphragm.length) put("diaphragm", diaphragm.join("; "), "ambiguous");
  if (venous.length) put("venous_text", venous.join("; "), "ambiguous");
  if (thrombo.length) put("thrombo_hx", thrombo.join("; "), "ambiguous");
  if (arr.length) put("arrhythmia_hx", arr.join("; "), "ambiguous");
  if (collat.length) put("collat_free", collat.join("; "), "ambiguous");
  if (polarity(dx, /\bPLE\b|eiwitverliez/i) === "pos") put("ple", "bevestigd", "ambiguous");
  if (polarity(dx, /plastische bronchitis/i) === "pos") put("plastic_bronchitis", "bevestigd", "ambiguous");

  // ---- medication
  const medLines = meds.split("\n").map(s => s.trim()).filter(Boolean);
  if (medLines.length) {
    put("meds_text", medLines.join("; "));
    const ml = meds.toLowerCase();
    const ac = /marcoumar|sintrom|warfarin|acenocoumarol|fenprocoumon|phenprocoumon/.test(ml) ? "VKA"
      : /apixaban|eliquis|rivaroxaban|xarelto|edoxaban|lixiana|dabigatran|pradaxa/.test(ml) ? "DOAC"
      : /clexane|fraxiparin|enoxaparin|tinzaparin|innohep|fragmin|dalteparin|nadroparin/.test(ml) ? "LMWH"
      : /\basa\b|aspirin|asaflow|cardioaspirin|acetylsalicyl/.test(ml) ? "aspirine" : "geen";
    put("anticoag", ac, ac === "geen" ? "ambiguous" : "parsed");
    if (/ferro|ijzer|ferinject|tardyferon|ferrograd|venofer|ferricarboxymaltose/.test(ml)) put("iron_supp", "ja");
  }

  // ---- sex suggestion from pronouns / 'patiënte'
  const all = [anam, ko, dx].join(" ");
  const nm = (all.match(/\bhij\b/gi) || []).length + (/\bpatiënt\b/i.test(all) ? 1 : 0);
  const nf = (all.match(/\bzij\b|\bhaar\b/gi) || []).length + (/\bpatiënte\b/i.test(all) ? 3 : 0);
  if (nm !== nf && (nm >= 2 || nf >= 2)) put("sex", nm > nf ? "M" : "V", "ambiguous");

  // ---- anamnesis
  if (anam) {
    const present = Object.keys(SYMPTOM_RE).filter(k => polarity(anam, SYMPTOM_RE[k]) === "pos");
    put("symptoms", present, present.length ? "ambiguous" : "parsed");
    const ny = anam.match(/NYHA\s*(?:klasse|class)?\s*(IV|I{1,3}|[1-4])\b/i);
    if (ny) put("nyha", { 1: "I", 2: "II", 3: "III", 4: "IV" }[ny[1]] || ny[1].toUpperCase());
    if (/gewichtsverlies|afgevallen|vermagerd|(?:gewicht|kg)[^.]*?(?:verlo|verminder|gedaald|daling)|(?:verlo|verminder)[^.]*?(?:gewicht|kg)/i.test(anam)) put("weight_trend", "gewichtsverlies", "ambiguous");
    else if (/gewichtstoename|bijgekomen|(?:gewicht|kg)[^.]*?toegenomen/i.test(anam)) put("weight_trend", "gewichtstoename", "ambiguous");
    const sp = anam.match(/sport\s*:\s*([^\n]+)/i);
    if (sp) put("activity", /\b(geen|niet|nee)\b/i.test(sp[1]) ? "sedentair" : "regelmatig sportend", "ambiguous");
    else if (polarity(anam, /fitness|sport|fiets|zwem|jog|loopt|wandel/i) === "pos") put("activity", "recreatief actief", "ambiguous");
    const rk = anam.match(/roken\s*:\s*([^\n]+)/i);
    if (rk) put("smoking", /\bex\b|gestopt|vroeger|voormalig/i.test(rk[1]) ? "ex-roker" : /\b(niet|nee|nooit|geen)\b/i.test(rk[1]) ? "niet" : "actief");
    else if (/niet-?roker|rookt niet/i.test(anam)) put("smoking", "niet");
    else if (/ex-?roker/i.test(anam)) put("smoking", "ex-roker");
    // work
    const w = /(?:stopte|gestopt) met werken|werkloos|werkzoekend|op zoek naar (?:een )?(?:andere |nieuwe )?(?:werkgever|werk|job|baan)/i.test(anam) ? "werkzoekend"
      : /arbeidsongeschikt|invaliditeit|ziekteverlof|ziekte-?uitkering|langdurig ziek/i.test(anam) ? "arbeidsongeschikt"
      : /\bstudeert\b|\bstudent\b/i.test(anam) ? "student" : /gepensioneerd|met pensioen/i.test(anam) ? "gepensioneerd"
      : /deeltijds|halftijds|4\/5|parttime/i.test(anam) ? "deeltijds werkend" : /voltijds|fulltime/i.test(anam) ? "voltijds werkend" : null;
    if (w) put("work", w, "ambiguous");
    const wt = anam.match(/werkte als ([^).,;\n]+)/i), wt2 = anam.match(/werk(?:t|zaam)(?:\s+(?!als\b)\w+){0,2}\s+als ([^).,;\n]+)/i);
    if (wt) put("work_text", "voorheen " + wt[1].trim(), "ambiguous"); else if (wt2) put("work_text", wt2[1].trim(), "ambiguous");
    if (polarity(anam, /psycholo\w*|psychiat\w*|psychotherap\w*|therapeut/i) === "pos")
      put("psych_wellbeing", /gepland|voorzien|verwe(?:zen|zing)|aangemeld|wachtlijst/i.test(anam) ? "begeleiding voorzien" : "begeleiding lopend", "ambiguous");
    else if (polarity(anam, /stress|angst|depress|somber|burn-?out/i) === "pos") put("psych_wellbeing", "moeilijkheden, geen begeleiding", "ambiguous");
  }

  // ---- clinical exam
  if (ko) {
    const h = ko.match(/lengte\s*:?\s*(\d+(?:[.,]\d+)?)/i); if (h) put("height_cm", _num(h[1]));
    const g = ko.match(/gewicht\s*:?\s*(\d+(?:[.,]\d+)?)\s*(?:\(([^)]*)\))?/i);
    if (g) { put("weight_kg", _num(g[1])); if (g[2]) put("weight_prev", g[2].trim()); }
    const sa = ko.match(/\bsat\w*\s*:?\s*(\d+(?:[.,]\d+)?)/i); if (sa) put("spo2_clinic", _num(sa[1]));
    const p = ko.match(/(?:pols|hartfrequentie|\bHF\b)\s*:?\s*(\d{2,3})/i); if (p) put("hr_clinic", +p[1]);
    const bp = ko.match(/(?:\bBD\b|bloeddruk)[^\d\n]*(\d{2,3})\s*\/\s*(\d{2,3})/i); if (bp) { put("sbp_clinic", +bp[1]); put("dbp_clinic", +bp[2]); }
    const cong = [polarity(ko, /oedeem|oedemen/i), polarity(ko, /hepatomegalie|(?:hepar|lever) (?:is )?vergroot/i), polarity(ko, /ascites/i),
      polarity(ko, /halsvene\w* (?:gestuwd|verhoogd|gevuld)|stuwing/i)];
    if (cong.includes("pos")) put("congestion", "ja", "ambiguous");
    else if (cong.includes("neg") || /hepar niet vergroot/i.test(ko)) put("congestion", "nee");
  }

  // ---- ECG
  if (ecg) {
    const r = /flutter|\bIART\b|macro-?reentry/i.test(ecg) ? "atriale flutter/IART" : /\bVKF\b|\bAF\b|voorkamerfibrillatie|atriumfibrillatie/i.test(ecg) ? "voorkamerfibrillatie"
      : /pacing|pacemaker|\bDDD\b|\bVVI\b|\bAAI\b/i.test(ecg) ? (/atria|\bAAI\b/i.test(ecg) ? "atriale pacing" : "ventriculaire pacing")

  }

  // ---- echocardiography
  if (echo) {
    const E = echoSubs(echo);
    const besluit = Object.entries(E).filter(([k]) => /BESLUIT|CONCLUSIE/.test(k)).map(([, v]) => v).join(" ");
    const vf = (besluit + " ").match(/(goede|normale|behouden|licht (?:gedaalde|verminderde)|matig (?:gedaalde|verminderde)|ernstig (?:gedaalde|verminderde)|slechte)\s+(?:\w+\s+)?(?:systolische\s+)?(?:ventrikel)?functie/i);
    const mapVF = t => /goed|normaal|normale|behouden/i.test(t) ? "goede" : /licht/i.test(t) ? "licht verminderde" : /matig/i.test(t) ? "matig verminderde" : /ernstig|slecht/i.test(t) ? "ernstig verminderde" : null;

      const gf = echo.match(/globale (?:systolische )?functie (?:is )?(normaal|goed|licht verminderd|matig verminderd|ernstig verminderd|sterk verminderd)/i);
      if (gf) put("vent_function", mapVF(gf[1]), "ambiguous");
    }
    const ef = echo.match(/\bEF\b[^\d\n%]{0,12}(\d+(?:[.,]\d+)?)\s*%/); if (ef) put("lvef", _num(ef[1]));

    const avvKey = Object.keys(E).find(k => hlhs ? /TRICUSPIDALIS/.test(k) : /MITRALIS/.test(k)) || Object.keys(E).find(k => /AV-KLEP|GEMEENSCHAPPELIJKE/.test(k));
    if (avvKey) {
      const tok = /MITRALIS/.test(avvKey) ? /\bMI\b|insuff|regurg/i : /TRICUSPIDALIS/.test(avvKey) ? /\bTI\b|insuff|regurg/i : /insuff|regurg/i;
      const sen = sentencesOf(E[avvKey]).find(s => tok.test(s));
      const gr = sen ? gradeFrom(sen) : null;
      if (gr) put("avv_regurg", gr);
      put("avv_name", /MITRALIS/.test(avvKey) ? "mitralisklep" : /TRICUSPIDALIS/.test(avvKey) ? "tricuspidalisklep" : "gemeenschappelijke AV-klep", "ambiguous");

    const neo = besluit.match(/neo[- ]?(?:aorta\w*\s*)?(?:AI|insuff\w*|regurg\w*)\s*([^.,;]*)/i);
    const aoKey = Object.keys(E).find(k => /AORTAKLEP|NEO-?AORTA/.test(k));
    const aoSen = aoKey ? sentencesOf(E[aoKey]).find(s => /\bAI\b|insuff|regurg/i.test(s)) : null;
    if (neo) {
      const g1 = gradeFrom(neo[0]); if (g1) put("slv_regurg", g1);
      put("slv_name", "neo-aortaklep", "ambiguous");
      if (aoSen && gradeFrom(aoSen) && gradeFrom(aoSen) !== g1) {
        const piKey = Object.keys(E).find(k => /PULMONALIS/.test(k));
        const piSen = piKey ? sentencesOf(E[piKey]).find(s => /\bPI\b|insuff/i.test(s)) : null;
        notes.push(`Echo: aortaklep-sectie ‘${aoSen}’ ≠ besluit ‘${neo[0].trim()}’ → besluit gebruikt` + (piSen ? ` (pulmonalisklep-sectie: ‘${piSen}’ — neo-aorta na DKS?)` : "") + ". Controleren.");
      }
    } else if (aoSen) {
      const g2 = gradeFrom(aoSen); if (g2) put("slv_regurg", g2);
      put("slv_name", "aortaklep", "ambiguous");
    }
    if (/patente? connecties|connecties (?:zijn )?(?:patent|vrij)|vrije (?:fontan)?\s*connecties/i.test(echo)) put("echo_connections", "mooi/patent");
    else if (/stenose (?:van|ter hoogte van) (?:de )?(?:conduit|TCPC|Glenn|connectie|LPA|RPA)/i.test(echo)) put("echo_connections", "stenose", "ambiguous");
  }
  return { values, status, notes };
}

/* ---------------------------------------------------------------- lab */
const LAB_MAP = [
  [/^h(?:ae|a|e)moglobine\b/i, "hb"], [/^(?:bloedplaatjes(?: telling)?|trombocyten|thrombocyten)\b/i, "platelets"],
  [/^lymfocyten (?:aantal|absoluut)\b/i, "lymphocytes"], [/^creatinine\b/i, "creatinine"], [/^egfr\b/i, "egfr"],
  [/^(?:micro-?)?albumine\s*\/\s*creatinine|^albumine-?creatinine|^ACR\b/i, "acr"], [/^albumine\b(?!\s*\/)/i, "albumin"],
  [/^(?:AST|ASAT|GOT)\b/i, "ast"], [/^(?:ALT|ALAT|GPT)\b/i, "alt"], [/^(?:gamma[ -]?GT|GGT)\b/i, "ggt"],
  [/^(?:bilirubine totaal|totaal bilirubine|bilirubine)\b/i, "bilirubin"], [/^NT-?pro-?BNP\b/i, "ntprobnp"],
  [/^ferritine\b/i, "ferritin"], [/^(?:transferrine ?saturatie|TSAT)\b/i, "tsat"], [/^(?:alfa-?fetoprote(?:i|ï)ne|AFP)\b/i, "afp"],
  [/^alfa-?1-?antitrypsine.*(?:faec|feces|stoelgang)/i, "a1at_stool"],
];
function parseLab(text) {
  const { values, status, notes, put } = _mk();
  const ref = {}, abnormal = [];
  const raw = String(text || "").replace(/\r/g, "").split("\n").map(s => s.trim());
  const lines = [];
  for (let i = 0; i < raw.length; i++) {           // re-join wrapped analyte names
    const l = raw[i]; if (!l) continue;
    if (!/\d/.test(l) && i + 1 < raw.length && /^\*?\s*[<>]?\d/.test(raw[i + 1])) { lines.push(l + " " + raw[i + 1]); i++; } else lines.push(l);
  }
  let urine = false;
  const dt = String(text).match(/(\d{2})-(\d{2})-(\d{4})\s+\d{1,2}:\d{2}/);
  if (dt) put("lab_date", `${dt[1]}/${dt[2]}/${dt[3]}`);
  for (const l of lines) {
    if (/^->/.test(l)) continue;
    if (/\burine\b/i.test(l) && !/\d/.test(l)) { urine = true; continue; }
    if (/-\s*bloed\b|^(?:chemie|hematologie|stolling|tumormerkers|endocrinologie)/i.test(l)) urine = false;
    const star = /\s\*\s/.test(" " + l + " ");
    const mInr = l.match(/^protrombinetijd.*?(\d+(?:[.,]\d+)?)\s*INR\b/i) || l.match(/^INR\b\s*\*?\s*(\d+(?:[.,]\d+)?)/i);
    if (mInr) { put("inr", _num(mInr[1])); if (star) abnormal.push({ name: "INR", value: _num(mInr[1]), unit: "", range: "" }); continue; }
    const hit = LAB_MAP.find(([re]) => re.test(l));
    const nm = l.match(/^([^\d*<>]+?)\s*(?:\*\s*)?(?=[<>]?\d)/);
    const after = nm ? l.slice(nm[0].length) : "";
    const vm = after.match(/^[<>]?\s*(\d+(?:[.,]\d+)?)\s*(10\^?\d+\/L|[^\s\d<>=≤≥][^\s]*)?\s*(.*)$/);
    if (!vm) continue;
    const value = _num(vm[1]), unit = vm[2] || "", tail = vm[3] || "";
    const r1 = tail.match(/(<=|<|>=|>|≤|≥)\s*(\d+(?:[.,]\d+)?)/), r2 = tail.match(/(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/);
    let lo = null, hi = null;
    if (r2) { lo = _num(r2[1]); hi = _num(r2[2]); } else if (r1) { if (/</.test(r1[1]) || r1[1] === "≤") hi = _num(r1[2]); else lo = _num(r1[2]); }
    if (star) abnormal.push({ name: nm[1].trim(), value, unit, range: r2 ? `${r2[1]} - ${r2[2]}` : r1 ? `${r1[1]} ${r1[2]}` : "" });
    if (!hit) continue;
    let key = hit[1];
    if (urine && (key === "creatinine" || key === "albumin")) continue;
    if (key === "lymphocytes" && /%/.test(unit)) continue;
    let v = value;
    if (key === "acr" && /mmol/i.test(unit)) v = +(value * 8.84).toFixed(1);
    if (key === "albumin" && /g\/dl/i.test(unit)) v = value * 10;
    if (values[key] !== undefined) continue;          // first occurrence wins
    put(key, v); ref[key] = [lo, hi];
  }
  if (values.ntprobnp !== undefined && ref.ntprobnp && ref.ntprobnp[1] !== null) put("ntprobnp_interp", values.ntprobnp > ref.ntprobnp[1] ? "verhoogd" : "normaal");
  if (values.afp !== undefined && ref.afp && ref.afp[1] !== null) put("afp_interp", values.afp > ref.afp[1] ? "verhoogd" : "normaal");
  if (values.ast !== undefined && ref.ast && ref.ast[1] !== null) put("ast_uln", ref.ast[1]);
  if (!Object.keys(values).length) notes.push("Geen labowaarden herkend.");
  return { values, status, notes, ref, abnormal };
}

/* ---------------------------------------------------------------- liver ultrasound */
function parseLiverUS(text) {
  const { values, status, notes, put } = _mk();
  const t = String(text || "").replace(/\r/g, "");
  const line = re => (t.match(re) || [, ""])[1];
  const cm = t.match(/CONCLUSIE\s*:?\s*([\s\S]*)$/i);

  const F = [];

  if (/heterogeen|inhomogeen|grof/i.test(line(/parenchym\w*\s*:?\s*([^\n]*)/i))) F.push("heterogeen parenchym");
  if (polarity(t, /hepatomegalie|vergrote lever|lever (?:is )?vergroot/i) === "pos" || /vergroot|toegenomen/i.test(line(/volume\s*:?\s*([^\n]*)/i))) F.push("hepatomegalie");
  const lesLine = line(/letsels?\s*:?\s*([^\n]*)/i);
  if ((lesLine && polarity(lesLine, /letsel|nodul(?:e|us|i)\b|HCC|haard/i) === "pos") || polarity(concl, /(?:focale?|HCC)\b[^.]*letsel|\bHCC\b|haard/i) === "pos") F.push("focaal letsel");
  if (polarity(t, /splenomegal|vergrote milt|milt (?:is )?vergroot/i) === "pos") F.push("splenomegalie");

  const shunt = polarity(t, /\bSPSS\b|portosystemische|spontane shunt|varices|collateralen/i) === "pos";

  if (/hepatofug/i.test(line(/(?:V\.?|vena)\s*porta\w*\s*:?\s*([^\n]*)/i))) F.push("hepatofugale portale flow");
  if (polarity(concl, /portale hypertensie\w*/i) === "pos" || F.includes("ascites") || shunt || F.includes("hepatofugale portale flow")) F.push("portale hypertensietekenen");
  const order = FIELD.us_findings.options;
  put("us_findings", F.length ? order.filter(o => F.includes(o)) : ["geen afwijkingen"]);
  const sp = t.match(/milt[^.\n]*?(\d+(?:[.,]\d+)?)\s*cm/i); if (sp) put("spleen_cm", _num(sp[1]));
  if (concl) put("us_conclusion", concl);
  const prev = t.match(/voorgaande? onderzoek van (\d{2}[-\/.]\d{2}[-\/.]\d{4})/i); if (prev) put("us_prev_date", prev[1].replace(/[-.]/g, "/"));

}
function hasOtherData() {
  return Object.entries(state.data).some(([k, v]) => !["ead", "visit_date", "_ref", "_conflicts"].includes(k) && !(v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length)));
}
function clearAll(keep = {}) {
  Object.assign(state, { data: { ...keep }, pstatus: {}, src: {}, conflicts: {}, ref: {}, labAbn: [], notesBySrc: {}, counts: {}, boxSources: {}, letter: "", letterAuto: "", dirty: false, query: "", tab: "overview" });
  document.querySelectorAll(".srccard textarea").forEach(t => t.value = ""); $("#search").value = ""; $("#pastePanel").open = true;
  renderSources(); refresh(); render();
}
function onEadChange(newEad) {
  const prev = state.lastEad;
  if (prev && newEad && newEad !== prev && hasOtherData()) {
    if (confirm(`Nieuwe EAD (${newEad}): alle andere velden en verslagen wissen?`)) clearAll({ ead: newEad, visit_date: state.data.visit_date });
  }
  state.lastEad = newEad;
}
function resetAll() {
  if (state.dirty && !confirm("Alle ingevulde gegevens wissen en een nieuw bezoek starten?")) return;
  Object.assign(state, { data: {}, pstatus: {}, src: {}, conflicts: {}, ref: {}, labAbn: [], notesBySrc: {}, counts: {}, boxSources: {}, lastEad: "", letter: "", letterAuto: "", dirty: false, query: "", tab: "overview" });
  document.querySelectorAll(".srccard textarea").forEach(t => t.value = ""); $("#search").value = ""; $("#pastePanel").open = true;
  renderSources();
  refresh(); render();
}

document.addEventListener("DOMContentLoaded", () => {
  $("#srcGrid").innerHTML = SOURCES.map(([s, l, ph]) => `<div class="srccard" data-src="${s}"><div class="srchead"><label for="paste_${s}">${esc(l)}</label><span class="srcstat" id="stat_${s}"></span></div>
    <textarea id="paste_${s}" data-src="${s}" spellcheck="false" placeholder="${esc(ph)}"></textarea></div>`).join("");
  let deb = {};
  $("#srcGrid").addEventListener("input", e => {
    const s = e.target.dataset.src; if (!s) return;
    clearTimeout(deb[s]); deb[s] = setTimeout(() => ingest(s, e.target.value), 400);
  });
  renderSources();
  $("#btnReset").addEventListener("click", resetAll);
  $("#prevFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) prefill(f).catch(err => toast(err.message, "bad")); e.target.value = ""; });
  $("#hdrEad").addEventListener("input", e => { state.data.ead = e.target.value.trim(); state.dirty = true; refresh(); });
  $("#hdrEad").addEventListener("change", e => onEadChange(e.target.value.trim()));
  $("#hdrDate").addEventListener("input", e => { state.data.visit_date = e.target.value; state.dirty = true; refresh(); });
  $("#search").addEventListener("input", e => { state.query = e.target.value; render(); });
  $("#search").addEventListener("keydown", e => { if (e.key === "Escape") { e.target.value = ""; state.query = ""; render(); } });
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#search").focus(); $("#search").select(); } });
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; state.query = ""; $("#search").value = ""; render();
    $("#view").focus({ preventScroll: true });
  });
  const view = $("#view");
  view.addEventListener("input", e => {
    if (e.target.id === "letterText") {
      state.letter = e.target.value;
      $("#letterHint").textContent = state.letter !== state.letterAuto ? "Handmatig bewerkt — wijzigingen in de invoer worden pas verwerkt na ‘Brief opnieuw opbouwen’." : "";
      return;
    }
    if (e.target.dataset.k) onFieldInput(e.target);
  });
  view.addEventListener("change", e => { if (e.target.tagName === "SELECT" && e.target.dataset.k) onFieldInput(e.target); });
  view.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (chip) {
      const k = chip.dataset.k, o = chip.dataset.o, cur = new Set(state.data[k] || []);
      cur.has(o) ? cur.delete(o) : cur.add(o);
      state.data[k] = FIELD[k].options.filter(x => cur.has(x));
      chip.classList.toggle("on"); chip.setAttribute("aria-pressed", cur.has(o));
      state.dirty = true; refresh(); return;
    }
    const id = e.target.id;
    if (id === "btnCopy") copyLetter();
    else if (id === "btnDocx") download(letterDocx(state.letter, HEADINGS), visitFilename("docx"));
    else if (id === "btnXlsx") { download(visitXlsx(), visitFilename("xlsx")); state.dirty = false; toast("Excel-rij opgeslagen"); }
    else if (id === "btnRegen") { state.letter = buildLetter(state.data, state.D); state.letterAuto = state.letter; render(); }
  });
  view.addEventListener("change", e => { if (e.target.id === "mergeFiles" && e.target.files.length) mergeFiles([...e.target.files]); });
  window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });
  refresh(); render();
});

</script>
</body>
</html>
